name: Test and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package macOS app
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release binaries
        run: swift build -c release

      - name: Package app and CLI
        shell: bash
        run: |
          set -euo pipefail
          zsh scripts/build-app.sh --skip-build
          codesign --force --deep --sign - dist/uMacCleaner.app
          ditto -c -k --sequesterRsrc --keepParent dist/uMacCleaner.app dist/uMacCleaner-macos-arm64.zip
          cp .build/release/mclean dist/mclean
          ditto -c -k --sequesterRsrc --keepParent dist/mclean dist/mclean-macos-arm64.zip
          cd dist
          shasum -a 256 uMacCleaner-macos-arm64.zip mclean-macos-arm64.zip > SHA256SUMS

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uMacCleaner-macos-arm64
          path: |
            dist/uMacCleaner-macos-arm64.zip
            dist/mclean-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

      - uses: actions/download-artifact@v4
        with:
          name: uMacCleaner-macos-arm64
          path: release-assets

      - name: Attach downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/uMacCleaner-macos-arm64.zip
            release-assets/mclean-macos-arm64.zip
            release-assets/SHA256SUMS
          )
          if [[ "$REF_TYPE" == "tag" ]]; then
            gh release create "$REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          else
            short_sha="${COMMIT_SHA:0:12}"
            gh release create "build-$short_sha" "${assets[@]}" \
              --target "$COMMIT_SHA" --prerelease \
              --title "Development build $short_sha" --generate-notes
          fi
